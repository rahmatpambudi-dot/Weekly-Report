name: Auto-update data_embed.js

on:
  schedule:
    # Runs every day at 07:00 WIB (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate data_embed.js from source dashboards
        run: python3 scripts/generate_data_embed.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data_embed.js; then
            echo "No changes to data_embed.js, skipping commit."
          else
            git add data_embed.js
            git commit -m "Auto-update data_embed.js ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
